name: Bootstrap AkışFren Android Sources
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/android.tar.xz.b64'
      - '.github/workflows/bootstrap-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-sources:
    if: github.repository == 'furkansel-ops/AkisFren'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract original Android source files
        shell: bash
        run: |
          if [ ! -f .bootstrap/android.tar.xz.b64 ]; then
            echo "Android sources are already expanded."
            exit 0
          fi
          base64 --decode .bootstrap/android.tar.xz.b64 | tar -xJf -
          rm -rf .bootstrap
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/dev/akisfren/guard/MainActivity.java
      - name: Publish extracted sources to main
        shell: bash
        run: |
          if [ -d .bootstrap ]; then
            echo "Source extraction did not finish."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish AkışFren Android v0.4 source project"
            git push origin HEAD:main
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AkisFren-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
